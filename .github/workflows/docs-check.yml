name: Docs Checks

on:
  pull_request:
    paths:
      - 'src/content/docs/**'
      - 'astro.config.mjs'
      - 'scripts/check-docs-metadata.mjs'
      - 'package.json'
      - '.github/workflows/docs-check.yml'
  workflow_dispatch:

jobs:
  docs-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check docs metadata
        run: pnpm docs:check
