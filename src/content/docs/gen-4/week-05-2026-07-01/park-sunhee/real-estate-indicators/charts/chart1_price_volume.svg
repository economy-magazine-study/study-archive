<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="680" height="320" fill="#ffffff" rx="8"/>
  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">① 실거래가·거래량 추이 (예시)</text>
  <!-- Y-axis labels left (price) -->
  <text x="52" y="68" text-anchor="end" font-size="11" fill="#6b7280">8억</text>
  <text x="52" y="108" text-anchor="end" font-size="11" fill="#6b7280">7억</text>
  <text x="52" y="148" text-anchor="end" font-size="11" fill="#6b7280">6억</text>
  <text x="52" y="188" text-anchor="end" font-size="11" fill="#6b7280">5억</text>
  <text x="52" y="228" text-anchor="end" font-size="11" fill="#6b7280">4억</text>
  <!-- Y-axis labels right (volume) -->
  <text x="628" y="68" text-anchor="start" font-size="11" fill="#6b7280">80건</text>
  <text x="628" y="128" text-anchor="start" font-size="11" fill="#6b7280">60건</text>
  <text x="628" y="188" text-anchor="start" font-size="11" fill="#6b7280">40건</text>
  <text x="628" y="248" text-anchor="start" font-size="11" fill="#6b7280">20건</text>
  <!-- Grid lines -->
  <line x1="60" y1="65" x2="620" y2="65" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="105" x2="620" y2="105" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="145" x2="620" y2="145" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="185" x2="620" y2="185" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="225" x2="620" y2="225" stroke="#f3f4f6" stroke-width="1"/>
  <!-- X axis -->
  <line x1="60" y1="250" x2="620" y2="250" stroke="#d1d5db" stroke-width="1"/>
  <!-- Y axis -->
  <line x1="60" y1="50" x2="60" y2="250" stroke="#d1d5db" stroke-width="1"/>
  <!-- Volume bars (monthly, light blue) -->
  <!-- months: Jan~Dec, bar width 32, gap 14 -->
  <!-- data: 32,45,38,55,62,70,68,50,42,35,28,40 (×2.5 scale, max=80) -->
  <rect x="68" y="170" width="32" height="80" fill="#bfdbfe" rx="2"/>
  <rect x="114" y="137" width="32" height="113" fill="#bfdbfe" rx="2"/>
  <rect x="160" y="155" width="32" height="95" fill="#bfdbfe" rx="2"/>
  <rect x="206" y="112" width="32" height="138" fill="#bfdbfe" rx="2"/>
  <rect x="252" y="95" width="32" height="155" fill="#bfdbfe" rx="2"/>
  <rect x="298" y="75" width="32" height="175" fill="#bfdbfe" rx="2"/>
  <rect x="344" y="80" width="32" height="170" fill="#bfdbfe" rx="2"/>
  <rect x="390" y="125" width="32" height="125" fill="#bfdbfe" rx="2"/>
  <rect x="436" y="145" width="32" height="105" fill="#bfdbfe" rx="2"/>
  <rect x="482" y="162" width="32" height="88" fill="#bfdbfe" rx="2"/>
  <rect x="528" y="180" width="32" height="70" fill="#bfdbfe" rx="2"/>
  <rect x="574" y="150" width="32" height="100" fill="#bfdbfe" rx="2"/>
  <!-- Price line (red) — price rises then flattens -->
  <!-- price data: 4.5억→5억→5.2억→5.5억→6억→6.8억→7.2억→7.5억→7.6억→7.5억→7.3억→7.4억 -->
  <!-- scale: 4억=225, 8억=65 → 1억=40px -->
  <!-- x positions: center of bars = 84,130,176,222,268,314,360,406,452,498,544,590 -->
  <polyline points="84,207 130,185 176,177 222,165 268,145 314,117 360,101 406,85 452,81 498,85 544,93 590,89"
    fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Dots on price line -->
  <circle cx="84" cy="207" r="4" fill="#ef4444"/>
  <circle cx="130" cy="185" r="4" fill="#ef4444"/>
  <circle cx="176" cy="177" r="4" fill="#ef4444"/>
  <circle cx="222" cy="165" r="4" fill="#ef4444"/>
  <circle cx="268" cy="145" r="4" fill="#ef4444"/>
  <circle cx="314" cy="117" r="4" fill="#ef4444"/>
  <circle cx="360" cy="101" r="4" fill="#ef4444"/>
  <circle cx="406" cy="85" r="4" fill="#ef4444"/>
  <circle cx="452" cy="81" r="4" fill="#ef4444"/>
  <circle cx="498" cy="85" r="4" fill="#ef4444"/>
  <circle cx="544" cy="93" r="4" fill="#ef4444"/>
  <circle cx="590" cy="89" r="4" fill="#ef4444"/>
  <!-- X labels -->
  <text x="84" y="268" text-anchor="middle" font-size="10" fill="#6b7280">1월</text>
  <text x="130" y="268" text-anchor="middle" font-size="10" fill="#6b7280">2월</text>
  <text x="176" y="268" text-anchor="middle" font-size="10" fill="#6b7280">3월</text>
  <text x="222" y="268" text-anchor="middle" font-size="10" fill="#6b7280">4월</text>
  <text x="268" y="268" text-anchor="middle" font-size="10" fill="#6b7280">5월</text>
  <text x="314" y="268" text-anchor="middle" font-size="10" fill="#6b7280">6월</text>
  <text x="360" y="268" text-anchor="middle" font-size="10" fill="#6b7280">7월</text>
  <text x="406" y="268" text-anchor="middle" font-size="10" fill="#6b7280">8월</text>
  <text x="452" y="268" text-anchor="middle" font-size="10" fill="#6b7280">9월</text>
  <text x="498" y="268" text-anchor="middle" font-size="10" fill="#6b7280">10월</text>
  <text x="544" y="268" text-anchor="middle" font-size="10" fill="#6b7280">11월</text>
  <text x="590" y="268" text-anchor="middle" font-size="10" fill="#6b7280">12월</text>
  <!-- Legend -->
  <rect x="200" y="290" width="14" height="10" fill="#bfdbfe" rx="2"/>
  <text x="218" y="300" font-size="11" fill="#374151">거래량 (건, 우축)</text>
  <line x1="360" y1="295" x2="380" y2="295" stroke="#ef4444" stroke-width="2.5"/>
  <circle cx="370" cy="295" r="4" fill="#ef4444"/>
  <text x="386" y="300" font-size="11" fill="#374151">평균 실거래가 (좌축)</text>
  <!-- Annotation -->
  <text x="390" y="74" font-size="10" fill="#ef4444">거래량↓ 가격↑</text>
  <text x="390" y="86" font-size="10" fill="#6b7280">→ 상투 초입?</text>
</svg>
