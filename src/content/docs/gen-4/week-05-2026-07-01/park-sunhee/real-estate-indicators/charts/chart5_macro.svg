<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="680" height="310" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="680" height="310" fill="#ffffff" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">⑤ 실업률·경매 낙찰가율 추이 (예시)</text>
  <!-- Left Y axis (실업률 %) -->
  <text x="52" y="68" text-anchor="end" font-size="11" fill="#6b7280">6%</text>
  <text x="52" y="108" text-anchor="end" font-size="11" fill="#6b7280">5%</text>
  <text x="52" y="148" text-anchor="end" font-size="11" fill="#6b7280">4%</text>
  <text x="52" y="188" text-anchor="end" font-size="11" fill="#6b7280">3%</text>
  <text x="52" y="228" text-anchor="end" font-size="11" fill="#6b7280">2%</text>
  <!-- Right Y axis (낙찰가율 %) -->
  <text x="628" y="68" text-anchor="start" font-size="11" fill="#6b7280">110%</text>
  <text x="628" y="108" text-anchor="start" font-size="11" fill="#6b7280">100%</text>
  <text x="628" y="148" text-anchor="start" font-size="11" fill="#6b7280">90%</text>
  <text x="628" y="188" text-anchor="start" font-size="11" fill="#6b7280">80%</text>
  <text x="628" y="228" text-anchor="start" font-size="11" fill="#6b7280">70%</text>
  <!-- Grid -->
  <line x1="60" y1="65" x2="620" y2="65" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="105" x2="620" y2="105" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="145" x2="620" y2="145" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="185" text-anchor="start" x2="620" y2="185" stroke="#f3f4f6" stroke-width="1"/>
  <line x1="60" y1="225" x2="620" y2="225" stroke="#f3f4f6" stroke-width="1"/>
  <!-- 4% threshold line -->
  <line x1="60" y1="145" x2="620" y2="145" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="624" y="142" font-size="10" fill="#ef4444">4% 임계선</text>
  <line x1="60" y1="245" x2="620" y2="245" stroke="#d1d5db" stroke-width="1"/>
  <line x1="60" y1="50" x2="60" y2="245" stroke="#d1d5db" stroke-width="1"/>
  <!-- 10 months x: 84, 130, 176, 222, 268, 314, 360, 406, 452, 498, 544, 590 -->
  <!-- Scale left: 2%=225, 6%=65; per%=40px -->
  <!-- 실업률: 2.5,2.6,2.8,3.0,3.2,3.5,3.8,4.1,4.3,4.2,4.0,3.8% -->
  <!-- y: 2.5%=205, 2.6%=201, 2.8%=193, 3.0%=185, 3.2%=177, 3.5%=165, 3.8%=153, 4.1%=141, 4.3%=133, 4.2%=137, 4.0%=145, 3.8%=153 -->
  <!-- Scale right: 70%=225, 110%=65; per%=4px -->
  <!-- 낙찰가율: 105,103,100,98,95,90,85,80,76,78,82,86% -->
  <!-- y: 105%=85, 103%=93, 100%=105, 98%=113, 95%=125, 90%=145, 85%=165, 80%=185, 76%=201, 78%=193, 82%=177, 86%=161 -->
  <!-- 실업률 (빨간 선) -->
  <polyline points="84,205 130,201 176,193 222,185 268,177 314,165 360,153 406,141 452,133 498,137 544,145 590,153"
    fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- 낙찰가율 (파란 점선) -->
  <polyline points="84,85 130,93 176,105 222,113 268,125 314,145 360,165 406,185 452,201 498,193 544,177 590,161"
    fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7,4" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Dots on unemployment -->
  <circle cx="84" cy="205" r="3.5" fill="#ef4444"/>
  <circle cx="452" cy="133" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
  <circle cx="590" cy="153" r="3.5" fill="#ef4444"/>
  <!-- Dots on auction rate -->
  <circle cx="84" cy="85" r="3.5" fill="#3b82f6"/>
  <circle cx="452" cy="201" r="5" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>
  <circle cx="590" cy="161" r="3.5" fill="#3b82f6"/>
  <!-- Annotation: divergence zone -->
  <rect x="330" y="55" width="155" height="42" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="407" y="70" text-anchor="middle" font-size="10" fill="#dc2626">실업률↑ 낙찰가율↓</text>
  <text x="407" y="82" text-anchor="middle" font-size="10" fill="#dc2626">= 경기하강·하락장 초기</text>
  <text x="407" y="94" text-anchor="middle" font-size="10" fill="#dc2626">패턴 (3개월 추세로 판단)</text>
  <!-- Recovery annotation -->
  <text x="530" y="142" font-size="10" fill="#059669">반등 시작</text>
  <!-- X labels -->
  <text x="84" y="263" text-anchor="middle" font-size="10" fill="#6b7280">1월</text>
  <text x="176" y="263" text-anchor="middle" font-size="10" fill="#6b7280">3월</text>
  <text x="268" y="263" text-anchor="middle" font-size="10" fill="#6b7280">5월</text>
  <text x="360" y="263" text-anchor="middle" font-size="10" fill="#6b7280">7월</text>
  <text x="452" y="263" text-anchor="middle" font-size="10" fill="#6b7280">9월</text>
  <text x="544" y="263" text-anchor="middle" font-size="10" fill="#6b7280">11월</text>
  <!-- Legend -->
  <line x1="130" y1="285" x2="150" y2="285" stroke="#ef4444" stroke-width="2.5"/>
  <text x="155" y="289" font-size="11" fill="#374151">실업률 % (좌축)</text>
  <line x1="330" y1="285" x2="350" y2="285" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7,4"/>
  <text x="355" y="289" font-size="11" fill="#374151">경매 낙찰가율 % (우축)</text>
</svg>
